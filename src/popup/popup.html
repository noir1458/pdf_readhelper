<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Read Helper</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="eyebrow">LOCAL PDF WORKFLOW</div>
      <h1>PDF Read Helper</h1>
      <p id="status">Open the reader, or send the current PDF URL when available.</p>
      <button id="open-current" class="primary" type="button">Open current PDF</button>
      <button id="open-reader" type="button">Open empty reader</button>
      <small>PDF bytes stay on this device.</small>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
